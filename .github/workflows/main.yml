name: Unity 2D Platformer CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller*.cs" -print || true
          find Assets/ -name "BuildManager.cs" -print || true

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Install GameCI CLI
        run: |
          URL1="https://github.com/gameci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz"
          URL2="https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz"
          curl -sSL -f -o game-ci.tar.gz "$URL1" || curl -sSL -f -o game-ci.tar.gz "$URL2"
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Unity Tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity \
            --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.4.2f1 \
            --coverageEnabled=false \
            --artifactsPath=artifacts \
            --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: 6000.4.2f1
          versioning: None

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  mirror_repo:
    needs: run_tests
    if: github.repository == 'AlexanderDyatlov/ARPO-LAB1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "ОШИБКА: BACKUP_TOKEN is empty!"
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/AlexanderDyatlov/ARPO-LAB1-backup.git main
          echo "=== Код успешно продублирован ==="

  build_docker_image:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/alexanderdyatlov/platformer-game:latest
            ghcr.io/alexanderdyatlov/platformer-game:${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages

  # ЛР №6: уведомление в Telegram при любом исходе
  notify:
    needs: [sanity_check, run_tests, build_game, mirror_repo, build_docker_image, deploy_to_pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine pipeline status
        id: status
        env:
          R_SANITY: ${{ needs.sanity_check.result }}
          R_TESTS: ${{ needs.run_tests.result }}
          R_BUILD: ${{ needs.build_game.result }}
          R_MIRROR: ${{ needs.mirror_repo.result }}
          R_DOCKER: ${{ needs.build_docker_image.result }}
          R_PAGES: ${{ needs.deploy_to_pages.result }}
        run: |
          if [ "$R_SANITY" != "success" ]; then echo "stage=sanity_check" >> $GITHUB_OUTPUT
          elif [ "$R_TESTS" != "success" ]; then echo "stage=run_tests" >> $GITHUB_OUTPUT
          elif [ "$R_BUILD" != "success" ]; then echo "stage=build_game" >> $GITHUB_OUTPUT
          elif [ "$R_MIRROR" != "success" ] && [ "$R_MIRROR" != "skipped" ]; then echo "stage=mirror_repo" >> $GITHUB_OUTPUT
          elif [ "$R_DOCKER" != "success" ]; then echo "stage=build_docker_image" >> $GITHUB_OUTPUT
          elif [ "$R_PAGES" != "success" ]; then echo "stage=deploy_to_pages" >> $GITHUB_OUTPUT
          else echo "stage=none" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://alexanderdyatlov.github.io/ARPO-LAB1/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$STAGE" = "none" ]; then
            TEXT=$(printf 'Сборка ARPO-LAB1 завершена успешно.\nАвтор коммита: %s\nИгра доступна: %s\nПрогон: %s' "$AUTHOR" "$SITE_URL" "$RUN_URL")
          else
            TEXT=$(printf 'Сборка ARPO-LAB1 упала на задаче %s.\nАвтор коммита: %s\nЛог прогона: %s' "$STAGE" "$AUTHOR" "$RUN_URL")
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"